name: acorn RSI
# CP123 D2: the deterministic ($0/tokenless) RSI heartbeat. Runs the version-gate / eval / RLS-drift /
# brain-freshness checks via workflows/rsi.workflow.js — green unless the eval pyramid actually regressed.
# The Claude half (refresh a brain artifact, draft a new lint) additionally needs CLAUDE_CODE_OAUTH_TOKEN
# (chairman checklist, D8) and is NOT wired here. The engine-guard keeps the run green before the engine lands.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily (fleet convention)

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the brain-freshness check reads each file's last commit
      - name: Engine guard
        id: guard
        run: |
          if [ ! -f workflows/rsi.workflow.js ]; then
            echo "RSI engine not built yet — exiting green."
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.armed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Build (the RSI loop re-lints with the built CLI)
        if: steps.guard.outputs.armed == 'true'
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: RSI deterministic heartbeat (red on a real eval regression)
        if: steps.guard.outputs.armed == 'true'
        run: |
          set -o pipefail
          mkdir -p .rsi/proposed
          node workflows/rsi.workflow.js | tee ".rsi/proposed/acorn-rsi-$(date -u +%F).json"
      - name: Keep the proposal for review (never applied or merged by the loop)
        if: always() && steps.guard.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rsi-proposal
          path: .rsi/proposed/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Open or update the proposal issue for a person to review
        if: always() && hashFiles('.rsi/proposed/*.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(.rsi/proposed/*.json)
          proposal=${files[${#files[@]}-1]}
          [ -s "$proposal" ] || { echo "The proposal file is empty, so no issue."; exit 0; }
          jq -e '.proposed_diff | startswith("No drift this cycle") | not' "$proposal" > /dev/null \
            || { echo "The loop proposed nothing this run, so no issue."; exit 0; }
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            echo '````json'
            cat "$proposal"
            echo '````'
          } > "$RUNNER_TEMP/proposal-issue.md"
          number=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/proposal-issue.md"
          else
            gh issue create --title "Acorn: proposal from the self-improvement loop" --label proposal --body-file "$RUNNER_TEMP/proposal-issue.md"
          fi
