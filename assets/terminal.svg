<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">acorn --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: acorn [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">acorn — the database employee. Schema, migrations, RLS, pgvector, and tenant</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">isolation that survive production. Boundary: schema/data-layer only (not app</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">code). Powered by Energy.</text>
<text x="24" y="186" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -v, --version             print the acorn version</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  -h, --help                display help for command</text>
<text x="24" y="266" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  schema [options] &lt;brief&gt;  THE acceptance command: brief → tenancy +</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                            migrations + RLS + typed schema, applied to a fresh</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                            ephemeral DB, RLS verified by tests</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  rls                       row-level security: lint policies, generate the</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                            gated block, test as the un-privileged role</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  migration                 zero-downtime migrations: lint the outage-makers,</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                            rewrite to the safe two-step, apply to a branch</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  vector                    pgvector: plan the HNSW/halfvec table+index,</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                            measure recall before tuning</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  conn                      connection strings: the mandatory pooled :6543</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                            (prepare:false) + direct :5432 split</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  provision [options]       agent-provision lifecycle: an ephemeral branch/dev</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">                            DB → migrate → verify → merge-or-destroy</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                            (branch/dev only; refuses prod)</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
